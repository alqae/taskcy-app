name: "Deploy to Ionos"

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: [self-hosted]
    env:
      PORT: ${{ vars.PORT }}
      # DB_NAME: ${{ vars.DB_NAME }}
      # DB_PASS: ${{ secrets.DB_PASS }}
      # DB_USER: ${{ secrets.DB_USER }}
      # DB_HOST: ${{ vars.DB_HOST }}
      # DB_PORT: ${{ vars.DB_PORT }}
      # SMTP_HOST: ${{ vars.SMTP_HOST }}
      # SMTP_PORT: ${{ vars.SMTP_PORT }}
      # SMTP_USER: ${{ secrets.SMTP_USER }}
      # SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      # WEB_URL: ${{ vars.WEB_URL }}
      # API_URL: ${{ vars.API_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build and deploy
        run: |
          # Stop services
          docker compose down

          # Check network
          docker network inspect taskcy_app_proxy || docker network create taskcy_app_proxy

          # Start services
          docker compose up -d --build

          # Wait for services to start
          sleep 10

          # Run migrations
          docker compose exec api yarn run migration:run

          # Check if migrations are successful
          docker compose exec api yarn run migration:show

          # Check if services are running
          docker compose ps